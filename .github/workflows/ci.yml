name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # o app precisa ao menos carregar (imports, rotas, models) sem erro
      - run: node -e "import('./app.js').then(() => console.log('app ok'))"
